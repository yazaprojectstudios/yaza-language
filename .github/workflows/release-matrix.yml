name: YAZA Release Matrix

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release for current VERSION tag when triggered manually"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package (${{ matrix.platform }})
    timeout-minutes: 60
    env:
      YAZA_COMPILER_PROCESS_LIMIT_BYTES: "25769803776"
      YAZA_COMPILER_LIST_VECTOR_LIMIT_BYTES: "25769803776"
      YAZA_COMPILER_MAX_LIST_ITEMS: "32000000"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner_label: ubuntu-24.04
          - platform: linux-arm64
            runner_label: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner_label: macos-15
          - platform: darwin-x64
            runner_label: macos-15-intel
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies & configure swap
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y clang xz-utils libargon2-dev file
          sudo apt-get clean
          free -h
          df -h / /tmp
          if [ ! -f /ci-swapfile ]; then
            sudo fallocate -l 12G /ci-swapfile || sudo dd if=/dev/zero of=/ci-swapfile bs=1M count=12288 status=none
            sudo chmod 600 /ci-swapfile
            sudo mkswap /ci-swapfile
            sudo swapon -p 200 /ci-swapfile
            free -h
            swapon --show
            df -h /
          fi

      - name: Install macOS build dependencies
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          brew list argon2 >/dev/null 2>&1 || brew install argon2
          brew list xz >/dev/null 2>&1 || brew install xz

      - name: Build compiler and YazaBase from source
        run: sh scripts/build-host.sh

      - name: Verify target and smoke test compiler and database
        shell: bash
        run: |
          set -euo pipefail
          file build/yaza-llvm build/yazabase-cli
          build/yaza-llvm --version
          build/yazabase-cli --version

          hello_output=$(YAZA_STDLIB_DIR="$PWD/std" YAZA_RUNTIME_DIR="$PWD/runtime" \
            build/yaza run examples/hello.yz)
          printf '%s\n' "$hello_output"
          grep -Fxq 'Hello, world!' <<< "$hello_output"

          db_root=$(mktemp -d)
          trap 'rm -rf "$db_root"' EXIT
          build/yazabase-cli init "$db_root" ci_smoke
          build/yazabase-cli set-user "$db_root" ci-user 'ci-only-password-2026'
          build/yazabase-cli auth-check "$db_root" ci-user 'ci-only-password-2026'
          build/yazabase-cli sql "$db_root" ci_smoke 'CREATE TABLE smoke (id BIGINT PRIMARY KEY, label TEXT)'
          build/yazabase-cli sql "$db_root" ci_smoke "INSERT INTO smoke (id, label) VALUES (1, 'ready')"
          query_output=$(build/yazabase-cli sql "$db_root" ci_smoke 'SELECT label FROM smoke WHERE id = 1')
          printf '%s\n' "$query_output"
          grep -Fq 'ready' <<< "$query_output"

      - name: Package binaries built on this target
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version=${GITHUB_REF_NAME#v}
            test "$tag_version" = "$version"
          fi
          YAZA_VERSION="$version" sh scripts/package-release-target.sh "${{ matrix.platform }}"

      - name: Build macOS .pkg installer & VS Code VSIX
        if: matrix.platform == 'darwin-arm64'
        run: |
          sh scripts/build-macos-pkg.sh
          sh editors/vscode-yaza/package-vsix.sh

      - name: Upload platform archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.pkg
            dist/*.vsix
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Focused language, database, and API validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      YAZA_COMPILER_PROCESS_LIMIT_BYTES: "25769803776"
      YAZA_COMPILER_LIST_VECTOR_LIMIT_BYTES: "25769803776"
      YAZA_COMPILER_MAX_LIST_ITEMS: "32000000"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation dependencies & configure swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y clang xz-utils libargon2-dev
          sudo apt-get clean
          free -h
          df -h / /tmp
          if [ ! -f /ci-swapfile ]; then
            sudo fallocate -l 12G /ci-swapfile || sudo dd if=/dev/zero of=/ci-swapfile bs=1M count=12288 status=none
            sudo chmod 600 /ci-swapfile
            sudo mkswap /ci-swapfile
            sudo swapon -p 200 /ci-swapfile
            free -h
            swapon --show
            df -h /
          fi

      - name: Build host tools
        run: sh scripts/build-host.sh

      - name: Validate Linux C runtime & sanitizers
        run: CC=clang sh scripts/validate-runtime-v1-linux.sh

      - name: Validate Core 2 language features
        run: sh scripts/validate-core2-features.sh

      - name: Validate YazaBase API and configuration
        run: |
          sh scripts/validate-yazabase-api-v1.sh
          sh scripts/validate-api-profile-config.sh
          YAZA_STDLIB_DIR="$PWD/std" build/yaza run examples/auth-jwt-ywt-rbac-smoke.yz

      - name: Validate API project generation
        env:
          YAZA_TEST_CLI: ${{ github.workspace }}/build/yaza
        run: sh templates/api/tests/generation-smoke.sh

      - name: Validate generated API self-test
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          (
            cd "$work"
            "$GITHUB_WORKSPACE/build/yaza" new --api ci_api
            cd ci_api
            mkdir -p data
            "$GITHUB_WORKSPACE/build/yazabase-cli" set-user ./data ci_admin 'ci-only-api-password-2026'
            YAZA_STDLIB_DIR="$GITHUB_WORKSPACE/std" \
            YAZA_RUNTIME_DIR="$GITHUB_WORKSPACE/runtime" \
            YAZABASE_BIN="$GITHUB_WORKSPACE/build/yazabase-cli" \
            YAZABASE_USER=ci_admin \
            YAZABASE_PASSWORD='ci-only-api-password-2026' \
            YAZA_AUTH_SECRET="$("$GITHUB_WORKSPACE/build/yaza" secret token)" \
            YAZA_SELF_TEST=1 "$GITHUB_WORKSPACE/build/yaza" run src/main.yz
          )

  publish:
    name: Publish verified release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    needs: [build, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag metadata
        uses: actions/checkout@v4

      - name: Download exact platform build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Check matrix completeness and generate checksums
        id: release_meta
        working-directory: release-files
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat ../VERSION)
          test "$(find . -maxdepth 1 -name 'yaza-*.tar.gz' | wc -l | tr -d ' ')" = 4
          test "$(find . -maxdepth 1 -name 'yazabase-*.tar.gz' | wc -l | tr -d ' ')" = 4
          test -f "yaza-${version}-macos-arm64.pkg"
          test -f "yaza-latest.vsix"
          sha256sum ./*.tar.gz ./*.pkg ./*.vsix > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "tag_name=v${version}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: YAZA ${{ steps.release_meta.outputs.tag_name }}
          generate_release_notes: true
          files: |
            release-files/*.tar.gz
            release-files/*.pkg
            release-files/*.vsix
            release-files/SHA256SUMS.txt
