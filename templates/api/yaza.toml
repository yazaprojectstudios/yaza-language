[project]
name = "{{project_name}}"
template = "api"
language = "yaza"

[service]
name = "{{project_name}}"

[api]
bind = "127.0.0.1:8080"
default_response_format = "json"
allowed_response_formats = ["json", "yaza", "ybif"]
max_request_body_bytes = 16777216

[api.resources]
# Built-in YAZA resource profiles:
# - "balanced"   (Default - arena_mode = "adaptive", process cap 512 MiB, 32 concurrent slots)
# - "throughput" (arena_mode = "adaptive", process cap 2 GiB, 128 concurrent slots)
# - "low_memory" (arena_mode = "fixed", process cap 128 MiB, 8 concurrent slots)
profile = "balanced"
# Arena mode: "adaptive" (default for balanced/throughput) | "fixed" (default for low_memory)
arena_mode = "adaptive"
process_arena_limit = "512MiB"
request_arena_initial = "1MiB"
request_arena_floor = "256KiB"
request_arena_ceiling = "64MiB"
max_in_flight = 32
max_query_work_units = 100000000
workers = "auto"
worker_threads = 8
event_loop = "async_edge_triggered"
io_vectorization = true

[database]
# Supported database providers in YAZA:
# - "yazabase"   (Default - built-in Embedded & Standalone SQL Engine, ready to use out of the box)
# - "postgresql" (PostgreSQL 14+ via std/pg)
# - "mysql"      (MySQL 8+ / MariaDB via std/mysql)
# - "mssql"      (Microsoft SQL Server via std/mssql)
# - "nosql"      (Key-Value & Document store via std/nosql)
provider = "yazabase"
kind = "yazabase"
path = "./data/{{project_name}}.ydb"
# No built-in default credentials. Provision with 'yaza db set-user <dir> <user> <pass>' and export YAZABASE_USER/YAZABASE_PASSWORD.
username = ""
password = ""
auto_migrate = true

[architecture]
layers = ["root", "routes", "schemas", "controllers", "contracts", "services", "repositories", "interfaces", "models", "validators", "middleware", "config", "errors"]
allow = ["root -> config", "root -> routes", "root -> controllers", "root -> middleware", "root -> errors", "routes -> controllers", "routes -> schemas", "controllers -> services", "controllers -> interfaces", "controllers -> contracts", "controllers -> middleware", "controllers -> errors", "services -> repositories", "services -> interfaces", "services -> contracts", "services -> errors", "repositories -> interfaces", "repositories -> models", "repositories -> contracts", "repositories -> errors", "validators -> models"]
