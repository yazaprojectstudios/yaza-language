services:
  api:
    build: .
    container_name: {{project_name}}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      YAZABASE_DIR: /app/data
      YAZABASE_DB: {{project_name}}
      YAZABASE_USER: ${YAZABASE_USER:?Set YAZABASE_USER in .env}
      YAZABASE_PASSWORD: ${YAZABASE_PASSWORD:?Set YAZABASE_PASSWORD in .env}
    volumes:
      - yaza-data:/app/data
    restart: unless-stopped

volumes:
  yaza-data:
