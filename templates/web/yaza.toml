[project]
name = "{{project_name}}"
template = "web"
language = "yaza"

[service]
name = "{{project_name}}"

[api]
bind = "127.0.0.1:8080"
max_request_body_bytes = 1048576

[api.resources]
profile = "balanced"
arena_mode = "adaptive"
process_arena_limit = "512MiB"
request_arena_initial = "1MiB"
request_arena_floor = "256KiB"
request_arena_ceiling = "64MiB"
max_in_flight = 32
max_query_work_units = 100000000

[architecture]
layers = ["root"]
