[project]
name = "{{project_name}}"
template = "minimal-api"
language = "yaza"

[service]
name = "{{project_name}}"
bind = "127.0.0.1:8080"
max_request_body = "64KiB"
default_response_format = "json"

[api.resources]
# Profile options: "balanced" (default) | "throughput" | "low_memory"
profile = "balanced"
# Arena mode: "adaptive" (default for balanced/throughput) | "fixed" (default for low_memory)
arena_mode = "adaptive"
process_arena_limit = "512MiB"
max_in_flight = 32

[database]
# Provider options: "yazabase" (default) | "postgresql" | "mysql" | "mssql" | "nosql"
provider = "yazabase"
kind = "yazabase"
path = "./data/{{project_name}}.ydb"
username = ""
password = ""
