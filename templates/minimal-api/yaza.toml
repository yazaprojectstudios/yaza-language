[project]
name = "{{project_name}}"
template = "minimal-api"
language = "yaza"

[service]
name = "{{project_name}}"
bind = "127.0.0.1:8080"
max_request_body = "64KiB"
default_response_format = "json"

[api.resources]
# Pilihan profile: "balanced" (default) | "throughput" | "low_memory"
profile = "balanced"
# Mode arena: "adaptive" (default balanced/throughput) | "fixed" (default low_memory)
arena_mode = "adaptive"
process_arena_limit = "512MiB"
max_in_flight = 32

[database]
# Pilihan provider: "yazabase" (default) | "postgresql" | "mysql" | "mssql" | "nosql"
provider = "yazabase"
kind = "yazabase"
path = "./data/{{project_name}}.ydb"
username = ""
password = ""
