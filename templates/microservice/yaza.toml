[project]
name = "{{project_name}}"
template = "microservice"
language = "yaza"

[service]
name = "{{project_name}}"
bind = "0.0.0.0:8080"
max_request_body = "1MiB"
default_response_format = "json"
allowed_formats = ["json", "yaza", "ybif"]

[api.resources]
# Pilihan profile bawaan YAZA:
# - "balanced"   (Default - arena_mode = "adaptive", process cap 512 MiB, 32 concurrent slots)
# - "throughput" (arena_mode = "adaptive", process cap 2 GiB, 128 concurrent slots)
# - "low_memory" (arena_mode = "fixed", process cap 128 MiB, 8 concurrent slots)
profile = "balanced"
# Mode arena: "adaptive" (default balanced/throughput) | "fixed" (default low_memory)
arena_mode = "adaptive"
process_arena_limit = "512MiB"
request_arena_initial = "1MiB"
request_arena_floor = "256KiB"
request_arena_ceiling = "64MiB"
max_in_flight = 32
max_query_work_units = 100000000
workers = "auto"
worker_threads = 8
event_loop = "async_edge_triggered"
io_vectorization = true

[database]
# Pilihan provider database YAZA:
# - "yazabase"   (Default - Embedded & Standalone SQL Engine bawaan YAZA, otomatis terpasang & siap pakai)
# - "postgresql" (PostgreSQL 14+ via std/pg)
# - "mysql"      (MySQL 8+ / MariaDB via std/mysql)
# - "mssql"      (Microsoft SQL Server via std/mssql)
# - "nosql"      (Key-Value & Document store via std/nosql)
provider = "yazabase"
kind = "yazabase"
path = "./data/{{project_name}}.ydb"
# Tidak ada kredensial bawaan. Provision dengan 'yaza db set-user <dir> <user> <pass>' lalu pasok env YAZABASE_USER/YAZABASE_PASSWORD.
username = ""
password = ""
auto_migrate = true
