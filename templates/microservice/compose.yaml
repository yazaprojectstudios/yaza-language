services:
  service:
    build: .
    container_name: {{project_name}}
    ports:
      - "8080:8080"
    environment:
      - YAZA_ENV=production
      - PORT=8080
      - YAZABASE_DATA_DIR=/app/data
      - YAZABASE_USER=${YAZABASE_USER:?Set YAZABASE_USER in .env}
      - YAZABASE_PASSWORD=${YAZABASE_PASSWORD:?Set YAZABASE_PASSWORD in .env}
    volumes:
      - yazabase-data:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "/app/service", "--health"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

volumes:
  yazabase-data:
