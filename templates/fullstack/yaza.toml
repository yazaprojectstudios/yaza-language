[project]
name = "{{project_name}}"
template = "fullstack"
language = "yaza"

[service]
name = "{{project_name}}"

[api]
bind = "127.0.0.1:8080"
default_response_format = "json"
allowed_response_formats = ["json", "yaza", "ybif"]
max_request_body_bytes = 1048576

[web]
public_dir = "./public"
session_cookie = "yaza_session"
session_ttl_seconds = 3600

[api.resources]
# Hardware-aware AQB profiles: "balanced" (default) | "throughput" | "low_memory"
profile = "balanced"
arena_mode = "adaptive"
process_arena_limit = "512MiB"
request_arena_initial = "1MiB"
request_arena_floor = "256KiB"
request_arena_ceiling = "64MiB"
max_in_flight = 32
max_query_work_units = 100000000
workers = "auto"
worker_threads = 8

[database]
# Supported providers: "yazabase" (default) | "postgresql" | "mysql" | "mssql" | "nosql"
provider = "yazabase"
kind = "yazabase"
path = "./data/{{project_name}}.ydb"
username = ""
password = ""
auto_migrate = true

[architecture]
layers = ["main", "app", "config", "middleware", "controllers", "services", "models", "views"]
