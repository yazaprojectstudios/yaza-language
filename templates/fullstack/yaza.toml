[project]
name = "{{project_name}}"
template = "fullstack"
language = "yaza"

[workspace]
members = ["apps/api", "apps/web"]

[api.resources]
# Default workspace API envelope: balanced + adaptive
profile = "balanced"
arena_mode = "adaptive"

[database]
# Pilihan provider: "yazabase" (default) | "postgresql" | "mysql" | "mssql" | "nosql"
provider = "yazabase"
kind = "yazabase"
path = "./apps/api/data/{{project_name}}.ydb"
username = ""
password = ""
