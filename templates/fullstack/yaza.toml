[project]
name = "{{project_name}}"
template = "fullstack"
language = "yaza"

[service]
name = "{{project_name}}"

[api]
bind = "127.0.0.1:8080"
# MVC routes currently choose HTML or JSON themselves; these settings are
# reserved for future response negotiation and do not change route output.
# default_response_format = "json"
# allowed_response_formats = ["json", "yaza", "ybif"]
max_request_body_bytes = 16777216

[web]
# Reserved: the current MVC template uses ./public, yaza_session, and a
# 3600-second session in source. These keys are not runtime overrides yet.
# public_dir = "./public"
# session_cookie = "yaza_session"
# session_ttl_seconds = 3600

[api.resources]
# Profiles: balanced (default, 32 in-flight) | throughput (128) | low_memory (8)
# Arena modes: adaptive (balanced/throughput default) | fixed (low_memory default)
profile = "balanced"
# Active overrides: uncomment only the values you want to change.
# max_in_flight = 32
# workers = "auto"       # auto uses available CPUs, capped by max_in_flight
# workers = 8            # explicit worker count, 1..max_in_flight
# The following values are parsed and shown by `yaza config`, but the MVC
# runtime does not apply them to allocation or query execution yet.
# arena_mode = "adaptive"
# process_arena_limit = "512MiB"
# request_arena_initial = "1MiB"
# request_arena_floor = "256KiB"
# request_arena_ceiling = "64MiB"
# max_query_work_units = 100000000

[database]
# This MVC starter uses YazaBase with YAZABASE_DATA_DIR (default ./data)
# and the database name monolith. Provider/path overrides below are metadata
# only until the repository layer supports switching providers.
provider = "yazabase"
kind = "yazabase"
# path = "./data/monolith.ydb"
# Supply YAZABASE_USER and YAZABASE_PASSWORD through the environment.
# auto_migrate = true

[architecture]
layers = ["main", "app", "config", "middleware", "controllers", "services", "models", "views"]
