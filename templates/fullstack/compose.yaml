services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      YAZA_ENV: production
      YAZA_AUTH_SECRET: ${YAZA_AUTH_SECRET}
      YAZABASE_USER: ${YAZABASE_USER}
      YAZABASE_PASSWORD: ${YAZABASE_PASSWORD}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  app_data:
